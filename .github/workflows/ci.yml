name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  HUSKY: '0'

jobs:
  quality:
    name: Qualidade
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Instalar pnpm fixado pelo projeto
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Lint, formatação, tipos, testes, build e OpenAPI
        run: pnpm check

  integration:
    name: Integração e navegador
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: kafofo_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: kafofo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kafofo_ci -d kafofo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kafofo_ci:ci-only-password@127.0.0.1:5432/kafofo_test
      POC_DATABASE_URL: postgresql://kafofo_ci:ci-only-password@127.0.0.1:5432/kafofo_auth_poc
      AUTH_TEST_DATABASE_URL: postgresql://kafofo_ci:ci-only-password@127.0.0.1:5432/kafofo_auth_test
      INVITATION_TEST_DATABASE_URL: postgresql://kafofo_ci:ci-only-password@127.0.0.1:5432/kafofo_invitation_test
      CONTEXT_TEST_DATABASE_URL: postgresql://kafofo_ci:ci-only-password@127.0.0.1:5432/kafofo_context_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Instalar pnpm fixado pelo projeto
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile
      - name: Preparar bancos exclusivos e segredos descartáveis
        run: |
          pnpm --filter @kafofo/api exec node --input-type=module <<'JS'
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.TEST_DATABASE_URL });
          try {
            await pool.query('CREATE DATABASE kafofo_auth_poc');
            await pool.query('CREATE DATABASE kafofo_auth_test');
            await pool.query('CREATE DATABASE kafofo_context_test');
            await pool.query('CREATE DATABASE kafofo_invitation_test');
          } finally {
            await pool.end();
          }
          JS
          poc_auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$poc_auth_secret"
          echo "POC_AUTH_SECRET=$poc_auth_secret" >> "$GITHUB_ENV"
          product_auth_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$product_auth_secret"
          echo "AUTH_SECRET=$product_auth_secret" >> "$GITHUB_ENV"
      - name: Migrações e conectividade da fundação
        run: pnpm test:db
      - name: Integração da autenticação em PostgreSQL
        run: pnpm --filter @kafofo/auth-poc test:integration
      - name: Integração da autenticação do produto
        run: pnpm --filter @kafofo/api test:auth
      - name: Integração de núcleos e residências
        run: pnpm --filter @kafofo/api test:contexts
      - name: Instalar Chromium e bibliotecas de sistema
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E da fundação
        run: pnpm test:e2e
      - name: E2E da autenticação em HTTP
        run: pnpm --filter @kafofo/auth-poc test:e2e
      - name: E2E da autenticação do produto em HTTP
        run: pnpm test:auth:e2e
      - name: Preparar TLS local descartável
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/auth-poc-key.pem" \
            -out "$RUNNER_TEMP/auth-poc-cert.pem" \
            -days 1 -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1
      - name: E2E da autenticação em HTTPS
        env:
          POC_TLS_CERT: ${{ runner.temp }}/auth-poc-cert.pem
          POC_TLS_KEY: ${{ runner.temp }}/auth-poc-key.pem
        run: pnpm --filter @kafofo/auth-poc test:e2e
      - name: E2E da autenticação do produto em HTTPS
        env:
          AUTH_TLS_CERT: ${{ runner.temp }}/auth-poc-cert.pem
          AUTH_TLS_KEY: ${{ runner.temp }}/auth-poc-key.pem
        run: pnpm test:auth:e2e

      - name: E2E de núcleos e residências em HTTP
        run: pnpm test:contexts:e2e
      - name: E2E de núcleos e residências em HTTPS
        env:
          AUTH_TLS_CERT: ${{ runner.temp }}/auth-poc-cert.pem
          AUTH_TLS_KEY: ${{ runner.temp }}/auth-poc-key.pem
        run: pnpm test:contexts:e2e

      - name: Integração dos convites
        run: pnpm --filter @kafofo/api test:invitations
      - name: E2E dos convites em HTTP
        run: pnpm test:invitations:e2e
      - name: E2E dos convites em HTTPS
        env:
          AUTH_TLS_CERT: ${{ runner.temp }}/auth-poc-cert.pem
          AUTH_TLS_KEY: ${{ runner.temp }}/auth-poc-key.pem
        run: pnpm test:invitations:e2e
