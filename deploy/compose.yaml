x-logging: &logging
  driver: none

x-api: &api
  image: ${API_IMAGE:?Configure API_IMAGE}
  platform: ${DEPLOY_PLATFORM:?Configure DEPLOY_PLATFORM}
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: api
    args:
      SOURCE_COMMIT: ${SOURCE_COMMIT:?Configure SOURCE_COMMIT}
      APP_VERSION: ${APP_VERSION:?Configure APP_VERSION}
  environment:
    SOURCE_COMMIT: ${SOURCE_COMMIT:?Configure SOURCE_COMMIT}
    APP_VERSION: ${APP_VERSION:?Configure APP_VERSION}
    AUTH_BASE_URL: ${AUTH_BASE_URL:?Configure AUTH_BASE_URL}
    AUTH_SECRET_FILE: /run/secrets/auth_secret
    DB_PASSWORD_FILE: /run/secrets/db_password
    TRUSTED_PROXIES: ${PROXY_ADDRESS:-172.29.16.2}
    LOG_LEVEL: info
  secrets: [db_password, auth_secret]
  volumes:
    - files:/var/lib/kafofo
    - logs:/logs
  networks: [proxy, database]
  logging: *logging

services:
  log-init:
    <<: *api
    user: root
    entrypoint: [node, logs.mjs, init]
    networks: []
    secrets: []
    environment: {}
    volumes: [logs:/logs]
    restart: 'no'
  logs:
    <<: *api
    user: root
    entrypoint: [node, logs.mjs, watch]
    networks: []
    secrets: []
    environment: {}
    volumes: [logs:/logs]
    depends_on:
      log-init: { condition: service_completed_successfully }
    restart: unless-stopped
  db:
    image: postgres:17.10-bookworm@sha256:9b18b78397054fce88a9552e9d5a3ad5bb7fd258c5b3cc1c5028e46373d6ea8f
    platform: ${DEPLOY_PLATFORM:?Configure DEPLOY_PLATFORM}
    restart: unless-stopped
    environment:
      POSTGRES_USER: kafofo
      POSTGRES_DB: kafofo
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [db_password]
    volumes:
      - postgres:/var/lib/postgresql/data
      - logs:/logs
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_directory=/logs/postgres
      - -c
      - log_filename=database.log
      - -c
      - log_rotation_age=0
      - -c
      - log_rotation_size=0
      - -c
      - log_min_error_statement=panic
      - -c
      - log_error_verbosity=terse
    networks: [database]
    depends_on:
      log-init: { condition: service_completed_successfully }
    healthcheck:
      test: [CMD-SHELL, pg_isready -U kafofo -d kafofo]
      interval: 3s
      timeout: 3s
      retries: 20
    logging: *logging
  api:
    <<: *api
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4304/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 20
  caddy:
    image: ${WEB_IMAGE:?Configure WEB_IMAGE}
    platform: ${DEPLOY_PLATFORM:?Configure DEPLOY_PLATFORM}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        SOURCE_COMMIT: ${SOURCE_COMMIT:?Configure SOURCE_COMMIT}
        APP_VERSION: ${APP_VERSION:?Configure APP_VERSION}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Configure SITE_ADDRESS}
      TLS_DIRECTIVE: ${TLS_DIRECTIVE-tls internal}
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80'
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - logs:/logs
    networks:
      edge: {}
      proxy:
        ipv4_address: ${PROXY_ADDRESS:-172.29.16.2}
    depends_on:
      api: { condition: service_healthy }
    logging: *logging

networks:
  edge: {}
  proxy:
    internal: true
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.29.16.0/24}
          ip_range: ${PROXY_DYNAMIC_RANGE:-172.29.16.128/25}
  database:
    internal: true

volumes:
  postgres: {}
  files: {}
  caddy-data: {}
  caddy-config: {}
  logs: {}

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:?Configure DB_PASSWORD_FILE}
  auth_secret:
    file: ${AUTH_SECRET_FILE:?Configure AUTH_SECRET_FILE}
